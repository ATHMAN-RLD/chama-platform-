{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Microfinance Chama Platform{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'groups/style.css' %}">
</head>
<body>
<nav>
    <a href="/">Dashboard</a> | <a href="/members/">Members</a> | <a href="/contributions/">Contributions</a> | <a href="/loans/">Loans</a>
    {% if user.is_authenticated %}
    | <form method="POST" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" style="background:none;border:none;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;cursor:pointer;padding:0;font-family:'Inter',sans-serif;">Logout ({{ user.username }})</button>
    </form>
{% else %}
    | <a href="{% url 'login' %}">Login</a>
{% endif %}
</nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
