{% extends 'groups/base.html' %}

{% block title %}Loans{% endblock %}

{% block content %}
    <h1>Loans</h1>
    <hr>
    <ul>
        {% for loan in loans %}
           <li class="status-{{ loan.status }}">{{ loan.membership.member.full_name }} - {{ loan.amount }} ({{ loan.status }})</li>
        {% endfor %}
    </ul>
{% endblock %}
